<div class="bg-white rounded-xl shadow-lg overflow-hidden flex flex-col h-full transition-all duaration-200 ease-out hover:-translate-y-1 hover:shadow-xl">

  <img [src]="product().images[0]" [routerLink]="['/products',product()._id]" class="w-full h-[300px] object-cover rounded-t-xl cursor-pointer " [alt]="product().title" />

  <div class="p-5 flex flex-col flex-1">
    <h3 class="text-lg font-semibold text-gray-900 mb-2 leading-tight">
      {{product().title}}
    </h3>
    <p class="text-sm text-gray-600 mb-4 flex-1 leading-relaxed">
      {{product().description}}
    </p>

    <div class="flex items-center justify-between mt-auto">
      <span class="text-2xl font-bold text-gray-900">{{product().price | currency:'EUR'}}</span>
      <button matButton="filled" class="flex items-center gap-2" (click)="onAddToCart()">
        <mat-icon>shopping_cart</mat-icon>
        Add to Cart
      </button>
    </div>
  </div>


</div>
