<div class="flex items-center gap-2">
  <button class="relative" matIconButton [routerLink]="['/cart']">
    <mat-icon [matBadge]="userCart.length" aria-hidden="false">shopping_cart</mat-icon>
  </button>
  @if (isAuthenticated) {
    <span class="mat-small mx-3 cursor-pointer" [routerLink]="['/orders']">{{currentUser$.getValue()?.email}}</span>
    <button matButton="outlined" (click)="onLogOut()">
      Log Out
    </button>
  } @else {
    <button matButton [routerLink]="['/login']">
      Sign In
    </button>
    <button matButton="filled" [routerLink]="['/register']">
      Sign up
    </button>
  }
</div>
