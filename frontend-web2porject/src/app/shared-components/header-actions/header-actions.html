<div class="flex items-center gap-5">
  @if (isAuthenticated) {
  @if(currentUser$.getValue()?.role != 'admin'){
  <button class="relative" matIconButton [routerLink]="['/cart']">
    <mat-icon  class="scale-125" [matBadge]="cartService.total()" aria-hidden="false">shopping_cart</mat-icon>
  </button>
  }
  <!-- Dropdown Menu -->
  <div class="relative mt-2 md:mt-0">
    <button
      class="text-dark text-semibold bg-gray-200 hover:bg-gray-300 focus-outline-none px-4 py-2 rounded-md inline-flex items-center"
      (click)="toggleDropdown()">
       {{currentUser$.getValue()?.firstName}} {{currentUser$.getValue()?.lastName }}

      <svg class="w-4 h-4 ms-1.5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
        fill="none" viewBox="0 0 24 24">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 9-7 7-7-7" />
      </svg>
    </button>
    <div [class]="isDropdownOpen? 'transition ease-out duration300' : 'hidden' "
      class="md:absolute right-0 mt-2 w-48 bg-gray-200 rounded-md shadow-lg z-10">
      <a [routerLink]="['/orders']" (click)="toggleDropdown()" class="block px-4 py-2 text-dark hover:bg-gray-400">Orders</a>
      <a (click)="onLogOut()" class="block px-4 py-2 text-dark hover:bg-gray-400">Log out</a>
    </div>
  </div>
  } @else {
  <button matButton [routerLink]="['/login']">
    Sign In
  </button>
  <button matButton="filled" [routerLink]="['/register']">
    Sign up
  </button>
  }
</div>
