<div class="flex flex-col items-center min-h-100 justify-center">
  
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()"
  class="block w-125 border border-gray-300 shadow-lg pt-5 pb-10 px-10 bg-gray-100">
  <h1 class="font-bold text-xl text-center mb-2">Login</h1>
    <div>
      <mat-form-field appearance="fill">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" type="email">
        <mat-error>
          <span>Email must have &#64; </span>
        </mat-error>
      </mat-form-field>
    </div>
    <div>

      <mat-form-field appearance="fill">
        <mat-label>Password</mat-label>
        <input matInput formControlName="password" type="password">
        <mat-error>
          <span>Password must be at least 6 characters long.</span>
        </mat-error>
      </mat-form-field>
    </div>
    <button mat-raised-button type="submit" [disabled]="loginForm.invalid">Login</button>
  </form>
</div>
